name: Vanguard Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: vanguard-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Vanguard
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 check.py

      - name: Save Vanguard state
        run: |
          git config user.name "Vanguard Monitor"
          git config user.email "actions@github.com"

          git add vanguard_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Vanguard state"
            git pull --rebase
            git push
          fi
